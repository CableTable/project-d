<h1>211c Compare follow paste — As built</h1>
<p>Clipboard preview follows the cursor with Compare snaps. Click adds a new snapshot; Escape cancels. Paste in place keeps the copied coordinates. One Undo removes the snapshot and restores line-up.</p>
