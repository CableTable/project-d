# Tests on every PR and push to main; a Windows build of the portable ProjectD.exe;
# a push to main (or a dispatch, how the merge job's merges release) publishes it to Releases.
name: Test, build and release

on:
  pull_request:
    # Not `labeled`: label an open PR `automerge`, then push, and that run merges it.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A PR push that changes only .md files skips test and build (they count as green).
  # Not `paths-ignore`: for pull_request it filters on the whole PR diff, so once a PR has code every push runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does this push change anything but .md?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --no-renames --name-only "$BEFORE" "$AFTER" > "$RUNNER_TEMP/files.txt" || echo "?" > "$RUNNER_TEMP/files.txt"
            # tools/ci-changes.mjs decides: an empty or failed diff stays code=true.
            # Skip only if the previous push's `changes` job succeeded and its test and build were green or skipped
            # (a failed `changes` makes them skipped too; a cancelled, red or missing run, or an API error, keeps code=true).
            gh api "repos/$REPO/commits/$BEFORE/check-runs?per_page=100" > "$RUNNER_TEMP/runs.json" || rm -f "$RUNNER_TEMP/runs.json"
            code=$(node tools/ci-changes.mjs "$RUNNER_TEMP/files.txt" "$RUNNER_TEMP/runs.json" || echo true)
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and unit tests
        if: matrix.shard == 1
        run: npm test
      - name: Playwright version, the cache key
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Chromium cache
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium, for the browser test
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The cache holds only the browser; on Linux the system libraries are apt packages, so they are still installed.
      - name: Chromium system libraries, on a cache hit
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: The UI in a browser
        env:
          SHARD: ${{ matrix.shard }}/4
        run: node browser.test.mjs $((5180 + ${{ matrix.shard }}))
      - name: Keep the screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-shard-${{ matrix.shard }}
          path: shots/
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    env:
      # LibreDWG newest nightly tag 0.14.8838 (2026-11-05).
      LIBREDWG_COMMIT: 4f2aef33865e0d5bf3774acc439953fba15dea3e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Measure the exe before embedding the DWG helper
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Rust tests without the DWG payload failed" }
          npx tauri build --no-bundle
          if ($LASTEXITCODE -ne 0) { throw "Baseline exe build failed" }
          "DWG_EXE_BEFORE=$((Get-Item src-tauri/target/release/ProjectD.exe).Length)" >> $env:GITHUB_ENV
      - name: Cached DWG helpers and licence
        id: dwgcache
        uses: actions/cache@v4
        with:
          path: src-tauri/dwg2dxf
          key: dwg2dxf-${{ runner.os }}-mingw64-v1-${{ env.LIBREDWG_COMMIT }}
      - name: LibreDWG source at the pinned commit
        if: steps.dwgcache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: LibreDWG/libredwg
          ref: ${{ env.LIBREDWG_COMMIT }}
          submodules: recursive
          path: tmp-libredwg
      - name: MinGW64 compiler for the DWG helpers
        if: steps.dwgcache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: minimal
          update: true
          install: >-
            base-devel
            autoconf-wrapper
            automake-wrapper
            libtool
            git
            gperf
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libtool
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-pcre2
      - name: Build dwg2dxf and dxf2dwg, static first
        if: steps.dwgcache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          out="$PWD/src-tauri/dwg2dxf"
          cd tmp-libredwg
          sh ./autogen.sh || true   # LibreDWG's own mingw job tolerates a failure here; ./configure fails if nothing was generated
          options=(--disable-bindings --disable-python --disable-docs)
          if ! (./configure "${options[@]}" --disable-shared --enable-static LDFLAGS=-static &&
                make -j2 -C src && make -j2 -C programs dwg2dxf.exe dxf2dwg.exe); then
            echo "Static link failed; retaining runtime DLLs instead."
            if [ -f Makefile ]; then make distclean; fi
            ./configure "${options[@]}" --enable-shared --disable-static
            make -j2 -C src
            make -j2 -C programs dwg2dxf.exe dxf2dwg.exe
          fi
          mkdir -p "$out"
          export PATH="$PWD/src/.libs:$PATH"
          for name in dwg2dxf dxf2dwg; do
            exe="programs/$name.exe"
            if [ -f "programs/.libs/$name.exe" ]; then exe="programs/.libs/$name.exe"; fi
            cp "$exe" "$out/$name.exe"
            ldd "$exe" > "$name.ldd"
            cat "$name.ldd"
            if grep -q 'not found' "$name.ldd"; then exit 1; fi
            while IFS= read -r dll; do
              case "${dll,,}" in /c/windows/*) continue ;; esac
              cp "$dll" "$out/"
            done < <(awk '/=> \// {print $3}' "$name.ldd")
          done
          find "$out" -type f \( -name '*.exe' -o -name '*.dll' \) -exec strip {} +
          cp COPYING "$out/"
          printf 'https://github.com/LibreDWG/libredwg/releases/tag/0.14.8838\nCommit: %s\n' "$LIBREDWG_COMMIT" > "$out/SOURCE.txt"
      - name: Touch the DWG payload so cargo reruns build.rs after a cache restore
        shell: pwsh
        run: Get-ChildItem src-tauri/dwg2dxf -Recurse | ForEach-Object { $_.LastWriteTime = Get-Date }
      - name: Build the portable exe (no installer)
        run: npx tauri build --no-bundle
      - name: DWG payload size in the portable exe
        shell: pwsh
        run: |
          $after = (Get-Item src-tauri/target/release/ProjectD.exe).Length
          Write-Host "ProjectD.exe bytes before DWG helper=$env:DWG_EXE_BEFORE after=$after"
          if ($after -le [long]$env:DWG_EXE_BEFORE) { throw "The exe did not grow: the DWG helper is not embedded" }
      - name: DWG round-trip through the embedded helper
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          # micro-gaps.dxf plus a TEXT holding Ø and ° as single cp1252 bytes: R2000 DWGs come back from LibreDWG in that code page, not UTF-8
          node --input-type=module -e "
            import { readFileSync, writeFileSync } from 'node:fs';
            const text = readFileSync('fixtures/micro-gaps.dxf', 'latin1').replace(/ENTITIES\r?\n/, (m) => m + '  0\nTEXT\n  8\n0\n 10\n0\n 20\n0\n 30\n0\n 40\n2.5\n  1\nØ12 90°\n');
            writeFileSync(process.env.RUNNER_TEMP + '/projectd-nonascii.dxf', text, 'latin1');
          "
          if ($LASTEXITCODE -ne 0) { throw "could not write the non-ASCII DXF" }
          & ./src-tauri/dwg2dxf/dxf2dwg.exe --as r2000 -y -o "$t/projectd-roundtrip.dwg" fixtures/micro-gaps.dxf
          if ($LASTEXITCODE -ne 0) { throw "dxf2dwg failed" }
          & ./src-tauri/dwg2dxf/dxf2dwg.exe --as r2000 -y -o "$t/projectd-nonascii.dwg" "$t/projectd-nonascii.dxf"
          if ($LASTEXITCODE -ne 0) { throw "dxf2dwg failed on the non-ASCII DXF" }
          $env:PROJECTD_DWG_ROUNDTRIP_INPUT = "$t/projectd-roundtrip.dwg"
          $env:PROJECTD_DWG_ROUNDTRIP_OUTPUT = "$t/projectd-roundtrip.dxf"
          cargo test --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw "Rust DWG helper tests failed" }
          $env:PROJECTD_DWG_ROUNDTRIP_INPUT = "$t/projectd-nonascii.dwg"
          $env:PROJECTD_DWG_ROUNDTRIP_OUTPUT = "$t/projectd-nonascii-out.dxf"
          cargo test --manifest-path src-tauri/Cargo.toml round_trip_embedded_helper
          if ($LASTEXITCODE -ne 0) { throw "Rust DWG helper failed on non-ASCII text (UTF-8 error?)" }
          node --input-type=module -e "
            import assert from 'node:assert/strict';
            import { readFileSync } from 'node:fs';
            import { decodeDxf, readDxf } from './web/drawing.js';
            const entities = (file) => readDxf(decodeDxf(readFileSync(file))).entities;
            const t = process.env.RUNNER_TEMP;
            const before = entities('fixtures/micro-gaps.dxf').length;
            const text = decodeDxf(readFileSync(t + '/projectd-roundtrip.dxf'));
            assert.match(text, /0\s*\r?\nSECTION\s*\r?\n\s*2\s*\r?\nENTITIES\s*\r?\n/);
            const after = readDxf(text).entities.length;
            assert.ok(before > 0);
            assert.equal(after, before);
            console.log('DWG round-trip ENTITIES: ' + before + ' -> ' + after);
            const wide = entities(t + '/projectd-nonascii.dxf').length;
            const back = entities(t + '/projectd-nonascii-out.dxf');
            assert.equal(back.length, wide);
            assert.ok(back.some((e) => JSON.stringify(e).includes('Ø12 90°')), 'the Ø and ° text did not come back');
            console.log('DWG round-trip non-ASCII text: ' + wide + ' -> ' + back.length);
          "
          if ($LASTEXITCODE -ne 0) { throw "DXF round-trip check failed" }
      - name: Smoke start, the exe must stay up for 10 s
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ProjectD.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "ProjectD.exe exited early with code $($p.ExitCode)" }
          Write-Host "ProjectD.exe still running after 10 s."
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectD-exe
          path: src-tauri/target/release/ProjectD.exe
          if-no-files-found: error

  release:
    needs: [test, build]
    # workflow_dispatch too: that's how the merge job's merges release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjectD-exe
          path: dist
      - name: Publish the release
        run: |
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" dist/ProjectD.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Project D $tag" --notes "Portable ProjectD.exe (no installer, no admin). Built from ${{ github.sha }}."

  # Auto-merge (as in Project R): a PR labelled `automerge` is merged here once test and
  # build pass, only the commit that was tested; then main is built and released.
  merge:
    needs: [changes, test, build]
    # always(): test / build are skipped on a doc-only push, and then nothing may merge.
    if: always() && needs.test.result == 'success' && needs.build.result == 'success' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge, then release main
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! out=$(gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$SHA" 2>&1); then
            echo "$out"
            read -r state head mergeable <<< "$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid,mergeable --jq '.state + " " + .headRefOid + " " + .mergeable')"
            if [ "$state" != "OPEN" ]; then echo "::notice::#$PR is already $state; nothing to merge."; exit 0; fi
            if [ "$head" != "$SHA" ]; then echo "::notice::A newer commit was pushed to #$PR; its own run tests and merges it."; exit 0; fi
            if [ "$mergeable" = "CONFLICTING" ]; then echo "::warning::#$PR conflicts with main: merge main into it and push."; exit 0; fi
            exit 1
          fi
          echo "$out"
          gh workflow run ci.yml --repo "$REPO" --ref main
          echo "Merged; building and releasing main."
