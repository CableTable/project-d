# Tests on every PR and push to main; a Windows build of the portable ProjectD.exe;
# a push to main (or a dispatch, how the merge job's merges release) publishes it to Releases.
name: Test, build and release

on:
  pull_request:
    # Not `labeled`: label an open PR `automerge`, then push, and that run merges it.
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A PR push that changes only .md files skips test and build (they count as green).
  # Not `paths-ignore`: for pull_request it filters on the whole PR diff, so once a PR has code every push runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does this push change anything but .md?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          code=true
          if [ "$EVENT" = "pull_request" ] && [ "$ACTION" = "synchronize" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files=$(git diff --no-renames --name-only "$BEFORE" "$AFTER" || echo "?")
            # An empty or failed diff stays code=true.
            # Skip only if the previous push's test and build were green (a cancelled, red or missing run, or an API error, keeps code=true).
            green=$(gh api "repos/$REPO/commits/$BEFORE/check-runs?per_page=100" --jq '[.check_runs[] | select(.name == "build" or (.name | startswith("test")))] | length > 0 and all(.conclusion == "success" or .conclusion == "skipped")' || echo false)
            if [ "$green" = "true" ] && [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and unit tests
        if: matrix.shard == 1
        run: npm test
      - name: Playwright version, the cache key
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"
      - name: Chromium cache
        id: pwcache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Chromium, for the browser test
        if: steps.pwcache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The cache holds only the browser; on Linux the system libraries are apt packages, so they are still installed.
      - name: Chromium system libraries, on a cache hit
        if: steps.pwcache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: The UI in a browser
        env:
          SHARD: ${{ matrix.shard }}/4
        run: node browser.test.mjs $((5180 + ${{ matrix.shard }}))
      - name: Keep the screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-shard-${{ matrix.shard }}
          path: shots/
          if-no-files-found: ignore

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Build the portable exe (no installer)
        run: npx tauri build --no-bundle
      - name: Smoke start, the exe must stay up for 10 s
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ProjectD.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($p.HasExited) { throw "ProjectD.exe exited early with code $($p.ExitCode)" }
          Write-Host "ProjectD.exe still running after 10 s."
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ProjectD-exe
          path: src-tauri/target/release/ProjectD.exe
          if-no-files-found: error

  release:
    needs: [test, build]
    # workflow_dispatch too: that's how the merge job's merges release.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ProjectD-exe
          path: dist
      - name: Publish the release
        run: |
          tag="v0.1.${{ github.run_number }}"
          gh release create "$tag" dist/ProjectD.exe --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Project D $tag" --notes "Portable ProjectD.exe (no installer, no admin). Built from ${{ github.sha }}."

  # Auto-merge (as in Project R): a PR labelled `automerge` is merged here once test and
  # build pass, only the commit that was tested; then main is built and released.
  merge:
    needs: [changes, test, build]
    # always(): test / build are skipped on a doc-only push, and then nothing may merge.
    if: always() && needs.test.result == 'success' && needs.build.result == 'success' && github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'automerge') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Merge, then release main
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! out=$(gh pr merge "$PR" --repo "$REPO" --merge --match-head-commit "$SHA" 2>&1); then
            echo "$out"
            read -r state head mergeable <<< "$(gh pr view "$PR" --repo "$REPO" --json state,headRefOid,mergeable --jq '.state + " " + .headRefOid + " " + .mergeable')"
            if [ "$state" != "OPEN" ]; then echo "::notice::#$PR is already $state; nothing to merge."; exit 0; fi
            if [ "$head" != "$SHA" ]; then echo "::notice::A newer commit was pushed to #$PR; its own run tests and merges it."; exit 0; fi
            if [ "$mergeable" = "CONFLICTING" ]; then echo "::warning::#$PR conflicts with main: merge main into it and push."; exit 0; fi
            exit 1
          fi
          echo "$out"
          gh workflow run ci.yml --repo "$REPO" --ref main
          echo "Merged; building and releasing main."
