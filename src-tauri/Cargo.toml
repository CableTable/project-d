[package]
name = "project-d"
version = "0.1.0"
description = "Project D: 2D engineering drawings and a 3D viewer"
edition = "2021"
rust-version = "1.77"

# The exe is ProjectD.exe (also set as mainBinaryName in tauri.conf.json).
[[bin]]
name = "ProjectD"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
